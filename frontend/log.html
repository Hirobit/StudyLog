<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>StudyLog - ログ詳細</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    header { background: #ccc; padding: 12px 16px; display: flex; align-items: center; gap: 16px; }
    .header-title { font-size: 18px; font-weight: bold; flex: 1; }
    .header-meta { font-size: 13px; color: #444; }
    .header-brand { font-size: 13px; color: #888; }
    .home-btn { padding: 6px 12px; background: #eee; border: 1px solid #aaa; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .menu-btn { padding: 6px 12px; background: #eee; border: 1px solid #aaa; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; }

    .layout { display: flex; height: calc(100vh - 56px); position: relative; }

    /* スライドサイドバー */
    .slide-sidebar { position: absolute; top: 0; left: 0; width: 180px; height: 100%; background: #ccc; padding: 16px; box-sizing: border-box; transform: translateX(-100%); transition: transform 0.3s ease; z-index: 50; box-shadow: 2px 0 8px rgba(0,0,0,0.2); }
    .slide-sidebar.open { transform: translateX(0); }
    .slide-sidebar h3 { margin: 0 0 16px; font-size: 15px; }
    .slide-sidebar ul { list-style: none; padding: 0; }
    .slide-sidebar ul li { margin: 10px 0; font-size: 14px; cursor: pointer; }
    .slide-sidebar ul li:hover { font-weight: bold; }

    /* 不明点サイドバー */
    .sidebar { width: 180px; background: #ddd; padding: 16px; border-right: 1px solid #ccc; flex-shrink: 0; display: flex; flex-direction: column; }
    .sidebar h3 { margin: 0 0 8px; font-size: 15px; text-align: center; }
    .sidebar textarea { flex: 1; width: 100%; padding: 8px; font-size: 13px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; resize: none; background: #f5f5f5; }

    /* メインエリア */
    .main { flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .title-box { border: 1px solid #ccc; border-radius: 8px; padding: 12px 16px; font-size: 18px; font-weight: bold; text-align: center; }
    .memo-box { flex: 1; border: 1px solid #ccc; border-radius: 8px; padding: 16px; background: #f0f0f0; display: flex; flex-direction: column; gap: 8px; }
    .memo-box h4 { margin: 0; font-size: 15px; text-align: center; }
    .memo-box textarea { flex: 1; width: 100%; padding: 8px; font-size: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; resize: none; background: white; line-height: 1.8; }
    .save-btn { align-self: flex-end; padding: 8px 24px; background: #444; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
    .save-btn:hover { background: #222; }

    /* オーバーレイ */
    .overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 40; }
    .overlay.open { display: block; }
  </style>
</head>
<body>
  <header>
    <button class="menu-btn" onclick="toggleSidebar()">☰ メニュー</button>
    <div class="header-title" id="header-title"></div>
    <div class="header-meta" id="header-meta"></div>
    <div class="header-brand">StudyLog</div>
  </header>

  <div class="layout">
    <div class="slide-sidebar" id="slide-sidebar">
      <button class="home-btn" onclick="location.href='index.html'" style="width:100%; margin-bottom:16px; padding:8px; background:#eee; border:1px solid #aaa; border-radius:6px; cursor:pointer; font-size:13px;">⌂ ホーム</button>
      <h3>カテゴリ一覧</h3>
      <ul id="slide-category-list"></ul>
    </div>

    <!-- 不明点サイドバー -->
    <div class="sidebar">
      <h3>不明点</h3>
      <textarea id="memo2-input" placeholder="不明点を入力..."></textarea>
    </div>

    <!-- メインエリア -->
    <div class="main">
      <div class="title-box" id="title-box"></div>
      <div class="memo-box">
        <h4>メモ</h4>
        <textarea id="memo-input" placeholder="メモを入力..."></textarea>
        <button class="save-btn" onclick="saveMemo()">保存</button>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin === "http://127.0.0.1:5500" || window.location.origin === "file://"
      ? "http://127.0.0.1:8000"
      : window.location.origin;
    const params = new URLSearchParams(location.search);
    const logId = params.get("log_id");
    let currentLog = null;

    async function loadLog() {
      const res = await fetch(`${API}/logs/detail/${logId}`);
      currentLog = await res.json();
      document.getElementById("header-title").textContent = `・${currentLog.title}`;
      document.getElementById("header-meta").textContent = currentLog.created_at ? currentLog.created_at.slice(0, 10) : "";
      document.getElementById("title-box").textContent = `学習内容　${currentLog.title}`;
      document.getElementById("memo-input").value = currentLog.memo || "";
      document.getElementById("memo2-input").value = currentLog.memo2 || "";
    }

    async function saveMemo() {
      const memo = document.getElementById("memo-input").value;
      const memo2 = document.getElementById("memo2-input").value;
      await fetch(`${API}/logs/${logId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: currentLog.title,
          memo: memo,
          memo2: memo2,
          subcategory_id: currentLog.subcategory_id
        })
      });
      alert("保存しました");
    }

    async function loadSlideCategories() {
      const res = await fetch(`${API}/categories`);
      const categories = await res.json();
      const ul = document.getElementById("slide-category-list");
      categories.forEach(cat => {
        const li = document.createElement("li");
        li.textContent = `・${cat.name}`;
        li.onclick = () => location.href = `category.html?category_id=${cat.id}&category_name=${cat.name}`;
        ul.appendChild(li);
      });
    }

    function toggleSidebar() {
      document.getElementById("slide-sidebar").classList.toggle("open");
      document.getElementById("overlay").classList.toggle("open");
    }

    function closeSidebar() {
      document.getElementById("slide-sidebar").classList.remove("open");
      document.getElementById("overlay").classList.remove("open");
    }

    loadLog();
    loadSlideCategories();
  </script>
</body>
</html>
