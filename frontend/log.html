<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyLog - ログ詳細</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; }

    /* ヘッダー */
    header { background: #ccc; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
    .menu-btn { padding: 6px 12px; background: #eee; border: 1px solid #aaa; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .header-meta { font-size: 13px; color: #444; flex: 1; }
    .header-brand { font-size: 13px; color: #888; }

    /* スライドサイドバー */
    .slide-sidebar { position: fixed; top: 0; left: 0; width: 200px; height: 100%; background: #ccc; padding: 16px; transform: translateX(-100%); transition: transform 0.3s ease; z-index: 100; box-shadow: 2px 0 8px rgba(0,0,0,0.2); }
    .slide-sidebar.open { transform: translateX(0); }
    .slide-sidebar .home-btn { display: block; width: 100%; padding: 10px; margin-bottom: 16px; background: #eee; border: 1px solid #aaa; border-radius: 6px; cursor: pointer; font-size: 14px; text-align: center; }
    .slide-sidebar h3 { margin-bottom: 12px; font-size: 15px; }
    .slide-sidebar ul { list-style: none; }
    .slide-sidebar ul li { margin: 10px 0; font-size: 14px; cursor: pointer; }
    .slide-sidebar ul li:hover { font-weight: bold; }
    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 90; background: rgba(0,0,0,0.2); }
    .overlay.open { display: block; }

    /* PC：デスクトップレイアウト */
    .pc-layout { display: flex; height: calc(100vh - 50px); }
    .pc-sidebar { width: 220px; background: #ddd; padding: 20px; border-right: 1px solid #ccc; display: flex; flex-direction: column; gap: 8px; }
    .pc-sidebar h3 { font-size: 15px; text-align: center; color: #444; }
    .pc-sidebar textarea { flex: 1; width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 8px; resize: none; background: #fafafa; font-family: sans-serif; line-height: 1.7; }
    .pc-main { flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .title-box { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 14px 16px; font-size: 18px; font-weight: bold; text-align: center; }
    .memo-card { flex: 1; background: white; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .memo-card-header { background: #e8e8e8; padding: 10px 16px; font-size: 15px; font-weight: bold; text-align: center; color: #444; border-bottom: 1px solid #ddd; }
    .memo-card-body { flex: 1; padding: 12px; }
    .memo-card-body textarea { width: 100%; height: 100%; min-height: 300px; padding: 10px; font-size: 15px; border: 1px solid #ddd; border-radius: 8px; resize: none; font-family: sans-serif; line-height: 1.7; background: #fafafa; outline: none; }
    .memo-card-body textarea:focus { border-color: #aaa; background: white; }
    .memo-card-footer { padding: 8px 12px 12px; display: flex; justify-content: flex-end; }
    .save-btn { padding: 8px 20px; background: #555; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .save-btn:hover { background: #333; }

    /* スマホ：非表示 */
    .mobile-layout { display: none; }

    /* スマホレイアウト */
    @media (max-width: 1024px) {
      .pc-layout { display: none; }
      .mobile-layout { display: block; overflow-y: auto; }

      .m-title { background: white; border-bottom: 1px solid #ddd; padding: 14px 16px; font-size: 16px; font-weight: bold; text-align: center; }
      .m-section-header { background: #e4e4e4; padding: 10px 16px; font-size: 14px; font-weight: bold; text-align: center; color: #444; border-top: 1px solid #ddd; border-bottom: 1px solid #ddd; }
      .m-section-body { background: white; padding: 14px 16px; }
      .m-section-body textarea { width: 100%; padding: 12px; font-size: 15px; border: 1.5px solid #ddd; border-radius: 10px; resize: none; font-family: sans-serif; line-height: 1.8; outline: none; background: #fafafa; }
      .m-section-body textarea:focus { border-color: #aaa; background: white; }
      .m-memo-area textarea { min-height: 220px; }
      .m-memo2-area textarea { min-height: 140px; }
      .m-footer { background: white; padding: 8px 16px 20px; display: flex; justify-content: flex-end; border-top: 1px solid #eee; }
      .m-footer .save-btn { padding: 9px 24px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <!-- スライドサイドバー -->
  <div class="slide-sidebar" id="slide-sidebar">
    <button class="home-btn" onclick="location.href='index.html'">⌂ ホーム</button>
    <h3>カテゴリ一覧</h3>
    <ul id="slide-category-list"></ul>
  </div>
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <header>
    <button class="menu-btn" onclick="toggleSidebar()">☰ メニュー</button>
    <div class="header-meta" id="header-meta"></div>
    <div class="header-brand">StudyLog</div>
  </header>

  <!-- PCレイアウト -->
  <div class="pc-layout">
    <div class="pc-sidebar">
      <h3>不明点</h3>
      <textarea id="memo2-input-pc" placeholder="不明点を入力..."></textarea>
    </div>
    <div class="pc-main">
      <div class="title-box" id="title-box-pc"></div>
      <div class="memo-card">
        <div class="memo-card-header">メモ</div>
        <div class="memo-card-body">
          <textarea id="memo-input-pc" placeholder="メモを入力..."></textarea>
        </div>
        <div class="memo-card-footer">
          <button class="save-btn" onclick="saveMemo()">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- スマホレイアウト -->
  <div class="mobile-layout">
    <div class="m-title" id="title-box-mobile"></div>
    <div class="m-section-header">メモ</div>
    <div class="m-section-body m-memo-area">
      <textarea id="memo-input-mobile" placeholder="メモを入力..."></textarea>
    </div>
    <div class="m-footer">
      <button class="save-btn" onclick="saveMemo()">保存</button>
    </div>
    <div class="m-section-header">不明点</div>
    <div class="m-section-body m-memo2-area">
      <textarea id="memo2-input-mobile" placeholder="不明点を入力..."></textarea>
    </div>
  </div>

  <script>
    const API = window.location.origin === "http://127.0.0.1:5500" || window.location.origin === "file://"
      ? "http://127.0.0.1:8000"
      : window.location.origin;
    const params = new URLSearchParams(location.search);
    const logId = params.get("log_id");
    let currentLog = null;

    async function loadLog() {
      const res = await fetch(`${API}/logs/detail/${logId}`);
      currentLog = await res.json();
      const date = currentLog.created_at ? currentLog.created_at.slice(0, 10) : "";
      const title = `学習内容　${currentLog.title}`;
      const memo = currentLog.memo || "";
      const memo2 = currentLog.memo2 || "";

      document.getElementById("header-meta").textContent = date;
      document.getElementById("title-box-pc").textContent = title;
      document.getElementById("title-box-mobile").textContent = title;
      document.getElementById("memo-input-pc").value = memo;
      document.getElementById("memo-input-mobile").value = memo;
      document.getElementById("memo2-input-pc").value = memo2;
      document.getElementById("memo2-input-mobile").value = memo2;
    }

    async function saveMemo() {
      const isMobile = window.innerWidth <= 1024;
      const memo = isMobile
        ? document.getElementById("memo-input-mobile").value
        : document.getElementById("memo-input-pc").value;
      const memo2 = isMobile
        ? document.getElementById("memo2-input-mobile").value
        : document.getElementById("memo2-input-pc").value;

      await fetch(`${API}/logs/${logId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: currentLog.title, memo, memo2, subcategory_id: currentLog.subcategory_id })
      });
      alert("保存しました");
    }

    async function loadSlideCategories() {
      const res = await fetch(`${API}/categories`);
      const categories = await res.json();
      const ul = document.getElementById("slide-category-list");
      categories.forEach(cat => {
        const li = document.createElement("li");
        li.textContent = `・${cat.name}`;
        li.onclick = () => location.href = `category.html?category_id=${cat.id}&category_name=${encodeURIComponent(cat.name)}`;
        ul.appendChild(li);
      });
    }

    function toggleSidebar() {
      document.getElementById("slide-sidebar").classList.toggle("open");
      document.getElementById("overlay").classList.toggle("open");
    }
    function closeSidebar() {
      document.getElementById("slide-sidebar").classList.remove("open");
      document.getElementById("overlay").classList.remove("open");
    }

    loadLog();
    loadSlideCategories();
  </script>
</body>
</html>
