<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyLog - ログ詳細</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; background: #f5f5f5; }

    /* ヘッダー */
    header { background: #ccc; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
    .menu-btn { padding: 6px 12px; background: #eee; border: 1px solid #aaa; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; flex-shrink: 0; }
    .header-meta { font-size: 13px; color: #444; flex: 1; }
    .header-brand { font-size: 13px; color: #888; }

    /* スライドサイドバー */
    .slide-sidebar { position: fixed; top: 0; left: 0; width: 200px; height: 100%; background: #ccc; padding: 16px; transform: translateX(-100%); transition: transform 0.3s ease; z-index: 100; box-shadow: 2px 0 8px rgba(0,0,0,0.2); }
    .slide-sidebar.open { transform: translateX(0); }
    .slide-sidebar .home-btn { display: block; width: 100%; padding: 10px; margin-bottom: 16px; background: #eee; border: 1px solid #aaa; border-radius: 6px; cursor: pointer; font-size: 14px; text-align: center; }
    .slide-sidebar h3 { margin: 0 0 12px; font-size: 15px; }
    .slide-sidebar ul { list-style: none; padding: 0; }
    .slide-sidebar ul li { margin: 10px 0; font-size: 14px; cursor: pointer; }
    .slide-sidebar ul li:hover { font-weight: bold; }
    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 90; background: rgba(0,0,0,0.2); }
    .overlay.open { display: block; }

    /* コンテンツ */
    .content { max-width: 800px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    /* タイトルボックス */
    .title-box { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 14px 16px; font-size: 17px; font-weight: bold; text-align: center; }

    /* セクション */
    .section { background: white; border-top: 1px solid #ddd; border-bottom: 1px solid #ddd; margin-bottom: 8px; }
    .section-header { background: #e4e4e4; padding: 10px 16px; font-size: 15px; font-weight: bold; text-align: center; color: #444; }
    .section-body { padding: 12px 16px; background: white; }
    .section textarea { width: 100%; border: 1.5px solid #ddd; border-radius: 10px; padding: 12px; font-size: 15px; line-height: 1.7; resize: none; background: white; font-family: sans-serif; outline: none; }
    .section textarea:focus { border-color: #aaa; }
    .section-footer { padding: 8px 16px 16px; display: flex; justify-content: flex-end; background: white; }
    .save-btn { padding: 8px 20px; background: #555; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .save-btn:hover { background: #333; }

    /* PCレイアウト */
    @media (min-width: 1025px) {
      header { padding: 12px 16px; }
      .menu-btn { font-size: 13px; }
      .content { flex-direction: row; flex-wrap: wrap; padding: 24px; gap: 16px; }
      .title-box { width: 100%; font-size: 18px; }
      .section.memo { flex: 2; }
      .section.memo2 { flex: 1; min-width: 180px; }
      .section textarea { min-height: 400px; }
    }

    /* スマホ */
    @media (max-width: 1024px) {
      .section textarea { min-height: 180px; font-size: 15px; }
      .section.memo2 .section-body textarea { min-height: 100px; }
    }
  </style>
</head>
<body>
  <!-- スライドサイドバー -->
  <div class="slide-sidebar" id="slide-sidebar">
    <button class="home-btn" onclick="location.href='index.html'">⌂ ホーム</button>
    <h3>カテゴリ一覧</h3>
    <ul id="slide-category-list"></ul>
  </div>
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <header>
    <button class="menu-btn" onclick="toggleSidebar()">☰ メニュー</button>
    <div class="header-meta" id="header-meta"></div>
    <div class="header-brand">StudyLog</div>
  </header>

  <div class="content">
    <div class="title-box" id="title-box"></div>

    <div class="section memo">
      <div class="section-header">メモ</div>
      <div class="section-body">
        <textarea id="memo-input" placeholder="メモを入力..."></textarea>
      </div>
      <div class="section-footer">
        <button class="save-btn" onclick="saveMemo()">保存</button>
      </div>
    </div>

    <div class="section memo2">
      <div class="section-header">不明点</div>
      <div class="section-body">
        <textarea id="memo2-input" placeholder="不明点を入力..."></textarea>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin === "http://127.0.0.1:5500" || window.location.origin === "file://"
      ? "http://127.0.0.1:8000"
      : window.location.origin;
    const params = new URLSearchParams(location.search);
    const logId = params.get("log_id");
    let currentLog = null;

    async function loadLog() {
      const res = await fetch(`${API}/logs/detail/${logId}`);
      currentLog = await res.json();
      document.getElementById("header-meta").textContent = currentLog.created_at ? currentLog.created_at.slice(0, 10) : "";
      document.getElementById("title-box").textContent = `学習内容　${currentLog.title}`;
      document.getElementById("memo-input").value = currentLog.memo || "";
      document.getElementById("memo2-input").value = currentLog.memo2 || "";
    }

    async function saveMemo() {
      const memo = document.getElementById("memo-input").value;
      const memo2 = document.getElementById("memo2-input").value;
      await fetch(`${API}/logs/${logId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: currentLog.title, memo, memo2, subcategory_id: currentLog.subcategory_id })
      });
      alert("保存しました");
    }

    async function loadSlideCategories() {
      const res = await fetch(`${API}/categories`);
      const categories = await res.json();
      const ul = document.getElementById("slide-category-list");
      categories.forEach(cat => {
        const li = document.createElement("li");
        li.textContent = `・${cat.name}`;
        li.onclick = () => location.href = `category.html?category_id=${cat.id}&category_name=${encodeURIComponent(cat.name)}`;
        ul.appendChild(li);
      });
    }

    function toggleSidebar() {
      document.getElementById("slide-sidebar").classList.toggle("open");
      document.getElementById("overlay").classList.toggle("open");
    }

    function closeSidebar() {
      document.getElementById("slide-sidebar").classList.remove("open");
      document.getElementById("overlay").classList.remove("open");
    }

    loadLog();
    loadSlideCategories();
  </script>
</body>
</html>
