<!DOCTYPE html>
<html lang="ja">
<head>

  <title>StudyLog - ログ詳細</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    header { background: #ccc; padding: 12px 16px; display: flex; align-items: center; gap: 16px; }
    .header-title { font-size: 18px; font-weight: bold; flex: 1; }
    .header-meta { font-size: 13px; color: #444; }
    .header-brand { font-size: 13px; color: #888; }
    .home-btn { padding: 6px 12px; background: #eee; border: 1px solid #aaa; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .menu-btn { padding: 6px 12px; background: #eee; border: 1px solid #aaa; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; }

    .breadcrumb { font-size: 13px; color: #444; background: #e8e8e8; padding: 8px 16px; }
    .layout { display: flex; height: calc(100vh - 90px); position: relative; }

    /* スライドサイドバー */
    .slide-sidebar { position: absolute; top: 0; left: 0; width: 180px; height: 100%; background: #ccc; padding: 16px; box-sizing: border-box; transform: translateX(-100%); transition: transform 0.3s ease; z-index: 50; box-shadow: 2px 0 8px rgba(0,0,0,0.2); }
    .slide-sidebar.open { transform: translateX(0); }
    .slide-sidebar h3 { margin: 0 0 16px; font-size: 15px; }
    .slide-sidebar ul { list-style: none; padding: 0; }
    .slide-sidebar ul li { margin: 10px 0; font-size: 14px; cursor: pointer; }
    .slide-sidebar ul li:hover { font-weight: bold; }

    /* 不明点サイドバー */
    .sidebar { width: 180px; background: #ddd; padding: 16px; border-right: 1px solid #ccc; flex-shrink: 0; display: flex; flex-direction: column; }
    .sidebar h3 { margin: 0 0 8px; font-size: 15px; }
    .sidebar textarea { flex: 1; width: 100%; padding: 8px; font-size: 13px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; resize: none; background: #f5f5f5; }

    /* メインエリア */
    .main { flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 16px; position: relative; }
    .title-box { border: 1px solid #ccc; border-radius: 8px; padding: 12px 16px; font-size: 18px; font-weight: bold; text-align: center; }
    .memo-box { flex: 1; border: 1px solid #ccc; border-radius: 8px; padding: 16px; background: #f0f0f0; display: flex; flex-direction: column; }
    .memo-box h4 { margin: 0 0 8px; font-size: 15px; text-align: center; }
